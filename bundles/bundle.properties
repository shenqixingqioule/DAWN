#————————区块————————


sector.破晓-寒岩山.name = Cold Rock Mountain
sector.破晓-寒岩山.description = After occupying Erekir, we used Erekir is new radar equipment to discover a cold planet in the Solar System.\nThere are some special minerals in the upper part of the planet, including some important materials, and we built a core.\nBut the enemies on this planet have also discovered us, they set up an outpost at our landing site in advance.\n\nGather Froststones and study units to attack the enemy outpost.\n\nKeep moving forward after the occupation.

sector.破晓-寒山河谷.name = Cold Mountain Valley
sector.破晓-寒山河谷.description = A medium-sized outpost not far from the base, this outpost is more extensive.\nWe found quite a few abandoned ruins in the area, and within the ruins, we discovered a new mineral.\n\nBefore the enemy reinforcements arrive, dig up Scrap Iron and develop stronger units and defenses to attack the enemy base.\n\n[red]Danger warning: There are special turrets inside the enemy base, so stay alert inside the base!

sector.破晓-7域军事平台.name = 7-Domain Military Platform
sector.破晓-7域军事平台.description = In a small base out in the wasteland, the enemy almost has the latest turrets.\nThere are unit factories deployed in the base, and the ground units advantage is minimal, so we chose to take down this base with the air units.\n\nBuild magnetic units to attack the turret blind spot.

sector.破晓-碎岩裂谷.name = Shattered Rock Gorge
sector.破晓-碎岩裂谷.description = We found some new minerals in a shattered canyon, but the enemy find to us first.\nThe enemy sent out some small troops to attack.\n\nMine chrome, research turrets, and defend against enemy attacks.

sector.破晓-凝液湖.name = Condensed liquid Lake
sector.破晓-凝液湖.description = A small base in the middle of an icy lake. \n\nThis lake was formed when the enemy was mining chrome and the Condensed liquid leaked up from underground. \nSince the enemy didn’t have time to rebuild their base, they had to set up a temporary one. \n\nStudy new buildings and produce naval units to attack them, taking control of this place to make it easier to gather more resources.


