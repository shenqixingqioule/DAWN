#————————区块————————


sector.破晓-寒岩山.name = 寒岩山
sector.破晓-寒岩山.description = 在占领埃里克尔之后我们使用埃里克尔的新雷达设备在太阳星系中发现了一颗寒冷的行星。\n在行星上部有一些特殊矿物，其中就有重要的材料，我们构造了一个核心。\n但在这个行星上的敌人也发现了我们，他们提前在我们降落的位置部署了一个前哨站。\n\n采集霜石研究单位以进攻敌方前哨站。\n\n在占领后继续前进。

sector.破晓-寒山河谷.name = 寒山河谷
sector.破晓-寒山河谷.description = 一个在基地不远处的中型前哨站，这个前哨站更加广密。\n在区域内我们发现了不少的废弃遗迹，在遗迹中我们发现了一种新矿物。\n\n在敌人支援来袭之前挖掘废铁并研究出更强大的单位和防线进攻敌方基地。\n\n[red]危险警告：在敌方基地内有特殊炮塔，请立即在基地内保持警惕！

sector.破晓-7域军事平台.name = 7域军事平台
sector.破晓-7域军事平台.description = 在一片荒原之中的小型基地，敌方几乎拥有最新的炮塔。\n在基地中有部署单位工厂，陆军的优势微乎其微，我们选择了用空军攻下这个基地。\n\n构建磁力单位在炮塔盲区进攻。

sector.破晓-碎岩裂谷.name = 碎岩裂谷
sector.破晓-碎岩裂谷.description = 我们在一处碎裂的丘山之中发现了一些新的矿物，但敌人提前发现了我们。\n敌人派出了一些小型的军队进行攻。\n\n挖掘铬矿研究炮塔并防御敌方进攻。

sector.破晓-凝液湖.name = 凝液湖
sector.破晓-凝液湖.description = 一个冰湖之中的小型基地。\n\n这片湖是敌方在开采铬资源的时候凝液从地底渗漏出来形成的。\n因时间原因，敌方不得不以临时搭建。\n\n研究新的建筑并制造海军单位攻击敌方，占领这里以方便收集更多资源。


